defaults:
  # *** application default settings ***
  # default period for the performance summary page
  performance_summary_period: D50
  # default comparison symbols for the performance summary page
  # (first listed is default)
  performance_summary_symbols: [SPY, QQQ, FFTY, ARKK]
  # maximum days for the time machine component increment slider
  # (default 180)
  max_time_machine_days: 180

# set the log mode for the specified modules to debug
debug: [
#    __main__,
#    pages.detail_performance,
#    pages.manage_balances,
#    pages.performance_summary,
#    pages.system_info,
#    utility.time_machine_component,
  ]
