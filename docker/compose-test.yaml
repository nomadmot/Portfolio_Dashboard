services:
  PortfolioDashboardTest:
    image: tdamon/nomadmot:portfolio-dashboard-test
    environment:
      - DATABASE_URI=sqlite://///home/devuser/investorlab/DATA/portfolio-test.db
      - DUCK_PUDDLE=/home/devuser/investorlab/DUCK_PUDDLE
      - LOGLEVEL_APPLICATION=INFO
      - LOGLEVEL_STREAMLIT=WARN
      - LOGLEVEL_SQLALCHEMY=WARN
      - YFINANCE_DEBUG=FALSE
      - SQLALCHEMY_ECHO=FALSE
      - SQLALCHEMY_ECHO_POOL=FALSE
    ports:
      - target: 8080
        published: "8089"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/Dropbox/Apps/Investing
        target: /home/devuser/investorlab
x-casaos:
  architectures:
    - arm64
  author: nomadmot
  category: unknown
  description:
    en_us: "test portfolio dashboard environment"
  developer: unknown
  hostname: ""
  icon: https://github.com/nomadmot/Portfolio_Dashboard/blob/main/src/images/Stock-Bull_192px.png
  index: /
  main: PortfolioDashboardTest
  title:
    custom: ""
    en_us: PortfolioDashboardTest