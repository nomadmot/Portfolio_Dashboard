services:
  PortfolioDashboard:
    image: tdamon/nomadmot:portfolio-dashboard
    environment:
      - DATABASE_URI=sqlite://///home/devuser/investorlab/DATA/portfolio.db
      - DUCK_DATABASE=/home/devuser/investorlab/DUCK_POND/pond.duckdb
      - LOGLEVEL_STREAMLIT=INFO
      - LOGLEVEL_SQLALCHEMY=WARN
      - YFINANCE_DEBUG=FALSE
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/Dropbox/Apps/Investing
        target: /home/devuser/investorlab
x-casaos:
  architectures:
    - arm64
  author: nomadmot
  category: unknown
  description:
    en_us: "portfolio dashboard environment"
  developer: unknown
  hostname: ""
  icon: https://github.com/nomadmot/Portfolio_Dashboard/blob/main/src/images/Stock-Bull_192px.png
  index: /
  main: PortfolioDashboard
  title:
    custom: ""
    en_us: PortfolioDashboard