[project]
name = "portfolio-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.2",
    "httpx>=0.28.1",
    "pandas>=2.3.1",
    "plotly>=6.2.0",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.48.1",
    "yfinance>=0.2.65",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
